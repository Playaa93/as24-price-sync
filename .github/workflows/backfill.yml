name: Backfill Historical Prices

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: "all" pour mars→nov 2025, ou mois specifiques "2025-03 2025-04"'
        required: true
        default: 'all'
      dry_run:
        description: 'Dry-run (simuler sans ecrire)'
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium

      - name: Run Backfill
        env:
          AS24_CLIENT_ID: ${{ secrets.AS24_CLIENT_ID }}
          AS24_USERNAME: ${{ secrets.AS24_USERNAME }}
          AS24_PASSWORD: ${{ secrets.AS24_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.mode }}" = "all" ]; then
            ARGS="--all"
          else
            ARGS="--month ${{ inputs.mode }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: python backfill_history.py $ARGS"
          python backfill_history.py $ARGS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-logs-${{ github.run_number }}
          path: backfill.log
          retention-days: 30
